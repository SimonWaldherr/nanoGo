name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Vet, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # This module has no external dependencies (no go.sum), so module
          # caching would only add a "no go.sum found" warning.
          cache: false

      - name: Set up Node for browser and WASM tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Formatting (gofmt)
        run: make fmt-check

      - name: Static checks (go vet)
        run: make vet

      - name: Static checks (js/wasm)
        run: make vet-wasm

      - name: Unit tests
        run: make test

      - name: Compare supported semantics with standard Go
        run: make test-compat

      - name: Browser regression tests
        run: make test-web

      - name: Run Go WASM tests in Node
        run: make test-wasm

      - name: Race detector
        run: make test-race

      - name: Build native CLI
        run: make build-cli

      - name: Build MCP server
        run: make build-mcp

      - name: Build WebAssembly playground
        run: make build-wasm

      - name: Execute the WebAssembly artifact
        run: make test-wasm-artifact

      - name: Install Binaryen for the optimized build
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build and execute optimized WebAssembly
        run: |
          make build-wasm-optimized WASM_OUT=build/optimized/nanogo.wasm
          make test-wasm-artifact WASM_OUT=build/optimized/nanogo.wasm
